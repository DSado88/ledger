[package]
name = "amazon-orders"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
scraper = "0.22"
reqwest = { version = "0.12", features = ["cookies", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
rust-mcp-sdk = "0.8"
async-trait = "0.1"
rookie = "0.5"
